[package]
name = "dropout-bigdata-pipeline-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
crossbeam = "0.8.4"
futures = "0.3.32"
hdrhistogram = "7.5.4"
instant = "0.1.13"
plotters = "0.3.7"
polars = { version = "0.53.0", features = [
    "parquet",
    "lazy",
    "csv",
    "dtype-full",
] }
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.38.4"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
tokio = { version = "1.52.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
