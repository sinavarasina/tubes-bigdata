services:
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    network_mode: "host"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.5.0
    container_name: kafka
    network_mode: "host"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: localhost:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_MESSAGE_MAX_BYTES: 10485760

  dev-workspace:
    image: docker.io/sinanonym/bigdata-workspace:v1
    container_name: dev-workspace
    network_mode: "host"
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=localhost:9092
      - KAFKA_TOPIC=student-data-rust
      - KAFKA_GROUP_ID=dropout-consumer-rust
    volumes:
      - ./case_1:/workspace/case_1
      - ./case_2:/workspace/case_2
      - ./data:/workspace/data
      - ./logs:/workspace/logs
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - ./scripts:/workspace/scripts
      - ./Makefile:/workspace/Makefile
    command: tail -f /dev/null

volumes:
  cargo-registry:
  cargo-git:
